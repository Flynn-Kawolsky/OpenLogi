project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: ".."

preserve_hierarchy: true

# Only the catalogs this build ships (openlogi_core::locale::SUPPORTED); a
# language exported here would land a `locales/*.toml` the binaries embed but
# the Settings picker never offers.
export_languages:
  - zh-TW

files:
  - source: "/crates/openlogi-ui/locales/en.toml"
    translation: "/crates/openlogi-ui/locales/%locale%.toml"
    type: "toml"
    update_option: "update_as_unapproved"
    languages_mapping:
      locale:
        zh-TW: "zh-TW"
