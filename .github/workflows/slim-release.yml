# Builds, signs and publishes the slim Windows MSI of this fork.
#
# Daily (and on demand, and on every push to `slim`) it takes the newest
# upstream release tag of AprilNEA/OpenLogi, replays the `slim` commits on top
# of it, and — when that version is not released here yet — builds the MSI,
# signs it with this fork's minisign key and publishes it with a latest.json
# manifest. Installed slim builds read that manifest (their update URL and
# public key are baked in at build time) and update in place.
#
# Version scheme: upstream X.Y.Z + N slim commits -> X.Y.(Z*1000+N), so the
# fork's versions sort above the upstream version they are based on and below
# the next upstream release. The crate version is set to the same value so the
# running app reports what the manifest advertises.
#
# A rebase conflict fails the run and opens an issue; nothing is published.
name: Slim release

on:
  schedule:
    - cron: "17 19 * * *" # 03:17 Asia/Taipei
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this version is already released
        type: boolean
        default: false
  push:
    branches: [slim]

permissions:
  contents: write
  issues: write

concurrency:
  group: slim-release
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/AprilNEA/OpenLogi.git
  MINISIGN_PUBLIC_KEY: RWRMLKeho9jxBR8Iu5BBf9GmakHk3ESuSWUDkp4GL+ylz+AfnDs4t2VG

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.plan.outputs.base }}
      latest: ${{ steps.plan.outputs.latest }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slim
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          git config user.name "slim-release"
          git config user.email "slim-release@users.noreply.github.com"
          git fetch --no-tags "$UPSTREAM_URL" '+refs/tags/v*:refs/tags/v*'
          # Upstream tags have a 1-3 digit patch; this fork's own release tags
          # (patch*1000+n) have 4+, so they never count as a base.
          upstream_tags=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]{1,3}$')
          base=""
          for t in $upstream_tags; do
            if git merge-base --is-ancestor "$t" HEAD; then base=$t; break; fi
          done
          [ -n "$base" ] || { echo "::error::no upstream release tag is an ancestor of slim"; exit 1; }
          latest=$(printf '%s\n' $upstream_tags | head -1)
          if [ "$latest" != "$base" ]; then
            if ! git rebase --onto "$latest" "$base" >/dev/null 2>&1; then
              git rebase --abort || true
              title="slim: rebase onto $latest needs manual resolution"
              if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
                gh issue create --title "$title" --body "The slim commits do not apply cleanly on $latest (based on $base). Rebase \`slim\` onto $latest by hand and push; the next run publishes it."
              fi
              echo "::error::rebase onto $latest failed"
              exit 1
            fi
          fi
          n=$(git rev-list --count "$latest"..HEAD)
          IFS=. read -r major minor patch <<<"${latest#v}"
          version="$major.$minor.$((patch * 1000 + n))"
          publish=true
          if gh release view "v$version" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then publish=false; fi
          echo "base=$base" >>"$GITHUB_OUTPUT"
          echo "latest=$latest" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
          echo "slim on $base -> $latest, version $version, publish=$publish"

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slim
          fetch-depth: 0
      - name: Replay slim on the upstream release
        shell: bash
        env:
          BASE: ${{ needs.plan.outputs.base }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          set -euo pipefail
          git config user.name "slim-release"
          git config user.email "slim-release@users.noreply.github.com"
          git fetch --no-tags "$UPSTREAM_URL" '+refs/tags/v*:refs/tags/v*'
          if [ "$LATEST" != "$BASE" ]; then git rebase --onto "$LATEST" "$BASE"; fi
      - name: Stamp the crate version
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $toml = Get-Content Cargo.toml -Raw
          $toml = [regex]::Replace($toml, '(?ms)(\[workspace\.package\].*?^version\s*=\s*")[^"]+(")', "`${1}$env:VERSION`${2}", 1)
          Set-Content Cargo.toml $toml -NoNewline
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: slim-msi-x86_64
      - name: Build MSI
        shell: pwsh
        env:
          # GitHub Releases serves flat asset names. Keep the appended
          # /channels/<channel>/latest.json in a URL fragment, which the
          # updater's HTTP client strips before requesting this asset.
          # Both channel choices follow this fork's single stable feed.
          OPENLOGI_UPDATE_BASE_URL: "https://github.com/${{ github.repository }}/releases/latest/download/latest.json#"
          OPENLOGI_UPDATE_MINISIGN_PUBLIC_KEY: ${{ env.MINISIGN_PUBLIC_KEY }}
        run: ./packaging/windows/build-msi.ps1 -Version ${{ needs.plan.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slim
      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: dist
      - name: Sign with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          key=$(mktemp)
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$key"
          for f in dist/*.msi; do minisign -S -s "$key" -m "$f" -t "OpenLogi slim ${{ needs.plan.outputs.version }}"; done
          rm -f "$key"
          for f in dist/*.msi; do minisign -V -P "$MINISIGN_PUBLIC_KEY" -m "$f"; done
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate latest.json
        env:
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          cargo run -q -p xtask -- release latest-json --dist dist --tag "$TAG" \
            --base-url "https://github.com/${{ github.repository }}" \
            --github-repo "${{ github.repository }}" --stage .release/stage
          cp ".release/stage/releases/$TAG/feed/latest.json" dist/latest.json
          cat dist/latest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.plan.outputs.version }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          set -euo pipefail
          notes="OpenLogi slim for Windows, based on upstream $LATEST. Install: download the MSI, check its SHA-256, run it (per-user, no admin). Installed builds update themselves from this release feed."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.msi dist/*.minisig dist/latest.json --clobber
          else
            gh release create "$TAG" dist/*.msi dist/*.minisig dist/latest.json --target "$(git rev-parse HEAD)" --title "OpenLogi slim $TAG" --notes "$notes" --latest
          fi
